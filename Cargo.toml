[package]
name = "http_burner"
version = "0.1.0"
edition = "2021"
description = "High-performance HTTP API load tester"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
owo-colors = "4"
indicatif = "0.17"
histogram = "0.6"
anyhow = "1"
